<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta | Eskillows</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="icon" href="../imagens/site.ico">

    <style>
        .conta-main {
            max-width: 850px;
            margin: 60px auto;
            padding: 20px;
        }

        .conta-card {
            background: #fff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        .conta-card h1 {
            margin-bottom: 10px;
        }

        .conta-info {
            margin-top: 30px;
            display: grid;
            gap: 18px;
        }

        .conta-campo {
            padding: 16px;
            background: #f7f7f7;
            border-radius: 10px;
        }

        .conta-campo strong {
            display: block;
            margin-bottom: 7px;
        }

        .conta-acoes {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .conta-acoes a,
        .conta-acoes button {
            padding: 13px 20px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
        }

        .conta-loja {
            background: #222;
            color: white;
        }

        .conta-sair {
            background: #f1e5e5;
            color: #9b2929;
        }

        #conta-mensagem {
            margin-top: 15px;
        }

        /* Botão administrativo */

        .conta-admin {
            background: #315d8a;
            color: white;
        }

        .conta-admin:hover {
            background: #234568;
        }

        #botao-admin[hidden] {
            display: none;
        }

    </style>
</head>

<body>

<header>
    <div class="header-header">
        <a href="index.html" class="brand-lockup">
            <img src="../imagens/site.png" alt="Eskillows" class="icone_site">
            <img src="../imagens/LOGO%20ESQ.png" alt="" class="brand-wordmark">
        </a>

        <nav class="icones-header-" aria-label="Navegação">
            <a href="index.html">Voltar à loja</a>

            <a href="carrinho.html" aria-label="Carrinho">
                <img src="../imagens/carrinho branco.png" alt="Carrinho" class="carrinho">
            </a>
        </nav>
    </div>
</header>

<main class="conta-main">
    <section class="conta-card">
        <h1>Minha Conta</h1>
        <p>Bem-vindo(a) à sua área de usuário da Eskillows!</p>

        <div id="conta-mensagem" role="status" aria-live="polite">
            Carregando suas informações...
        </div>

        <div class="conta-info">
            <div class="conta-campo">
                <strong>Nome</strong>
                <span id="usuario-nome">Carregando...</span>
            </div>

            <div class="conta-campo">
                <strong>E-mail</strong>
                <span id="usuario-email">Carregando...</span>
            </div>

            <div class="conta-campo">
                <strong>Tipo de conta</strong>
                <span id="usuario-perfil">Carregando...</span>
            </div>
        </div>

        <div class="conta-acoes">

            <a href="meus-pedidos.html" class="conta-loja">
                <i class="fa-solid fa-box"></i> Meus pedidos
            </a>

            <a href="index.html" class="conta-loja">
                <i class="fa-solid fa-store"></i> Voltar à loja
            </a>

            <!-- Acesso exclusivo para administradores -->

            <a href="admin.html" class="conta-admin" id="botao-admin" hidden>
                <i class="fa-solid fa-gear"></i> Painel Administrativo
            </a>

            <button type="button" class="conta-sair" id="botao-sair">
                <i class="fa-solid fa-right-from-bracket"></i> Sair da conta
            </button>

        </div>
    </section>
</main>

<footer>
    <div class="footer-info">
        <img src="../imagens/LOGO%20ESQ.png" alt="Eskillows">
        <p>Direitos reservados: Equipe Eskillows.</p>
    </div>
</footer>

<script src="../minha-conta.js"></script>

</body>
</html>
