<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrinho | Eskillows</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">

    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image" href="/imagens/site.ico">
</head>

<body>

    <header>

        <div class="header-header">

            <a href="/HTML/index.html">
                <img src="/imagens/site.png"
                    alt="Logo Eskillows"
                    class="icone_site">
            </a>

            <div class="icones-header-">

                <a href="/HTML/carrinho.html">
                    <img src="/imagens/carrinho branco.png"
                        alt="Carrinho"
                        class="carrinho">
                </a>

            </div>

        </div>

    </header>



    <main class="pagina-carrinho">

        <div class="caixa-carrinho">

            <h1>
                <i class="fa-solid fa-cart-shopping"></i>
                Meu Carrinho
            </h1>



            <ul id="lista-carrinho"></ul>

            <p id="carrinho-vazio">
                Seu carrinho está vazio.
            </p>


            <div class="resumo-carrinho">

                <h2>Resumo da compra</h2>

                <p id="total"></p>

                <button id="finalizarcomp">
                    <i class="fa-solid fa-check"></i>
                    Finalizar compra
                </button>

                <a href="/HTML/index.html#produtos"
                    class="continuar-comprando">

                    <i class="fa-solid fa-arrow-left"></i>
                    Continuar comprando

                </a>

            </div>


            <div id="recibo"></div>

        </div>

    </main>


    <footer>

        <div class="footer-info">

            <img src="/imagens/ESQ(1).png"
                alt="Logo Eskillows">

            <p>
                Direitos reservados: Anna Luisa, Lethicia Hikary,
                Erik Matheus, Giovanna Siqueira, Ewerthon Klaiver
            </p>

        </div>

    </footer>


    

    <script src="/script.js"></script>

</body>

</html>
