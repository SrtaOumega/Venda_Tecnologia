
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos | Eskillows</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="icon" href="../imagens/site.ico">

    <style>
        .pedidos-main {
            width: min(100% - 30px, 950px);
            margin: 50px auto;
        }

        .pedidos-card {
            padding: clamp(22px, 4vw, 38px);
            border: 1px solid var(--line);
            border-radius: 18px;
            background: #fff;
            box-shadow: var(--shadow);
        }

        .pedidos-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .pedidos-topo h1 {
            margin: 0;
            font-size: clamp(25px, 4vw, 32px);
            letter-spacing: -.04em;
        }

        .pedidos-topo p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .pedido {
            margin-bottom: 18px;
            padding: 22px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fff;
        }

        .pedido-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--line);
        }

        .pedido-numero {
            font-weight: 800;
            font-size: 15px;
        }

        .pedido-data {
            color: var(--muted);
            font-size: 12px;
        }

        .pedido-status {
            padding: 6px 12px;
            border-radius: 20px;
            color: #344b9b;
            background: var(--brand-soft);
            font-size: 11px;
            font-weight: 800;
        }

        .pedido-itens {
            display: grid;
            gap: 12px;
            margin: 18px 0;
        }

        .pedido-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
        }

        .pedido-item strong {
            display: block;
        }

        .pedido-item small {
            color: var(--muted);
        }

        .pedido-resumo {
            display: grid;
            gap: 8px;
            padding-top: 15px;
            border-top: 1px solid var(--line);
        }

        .pedido-resumo div {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            font-size: 13px;
        }

        .pedido-resumo .pedido-total {
            margin-top: 5px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
            font-size: 17px;
            font-weight: 800;
        }

        .pedido-desconto {
            color: var(--success);
        }

        .pedidos-vazio,
        .pedidos-mensagem {
            padding: 35px 15px;
            border-radius: 13px;
            background: #f7f8fa;
            color: var(--muted);
            text-align: center;
        }

        .pedidos-vazio i {
            display: block;
            margin-bottom: 15px;
            color: var(--brand);
            font-size: 35px;
        }

        .pedidos-vazio h2 {
            margin: 0 0 8px;
            color: var(--ink);
            font-size: 19px;
        }

        .pedidos-vazio p {
            margin: 0 0 18px;
            font-size: 13px;
        }

        .botao-pedidos {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            min-height: 42px;
            padding: 10px 16px;
            border-radius: 9px;
            color: #fff;
            background: var(--brand);
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .botao-pedidos:hover {
            background: var(--brand-dark);
        }

        .pedidos-acoes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .pedidos-acoes a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 15px;
            border: 1px solid var(--line);
            border-radius: 9px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .pedidos-acoes a:hover {
            background: var(--brand-soft);
            color: var(--brand-dark);
        }

        @media (max-width: 480px) {
            .pedido {
                padding: 16px;
            }

            .pedido-item {
                flex-direction: column;
                gap: 3px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-header">
        <a href="index.html" class="brand-lockup">
            <img src="../imagens/site.png" alt="Eskillows" class="icone_site">
            <img src="../imagens/LOGO%20ESQ.png" alt="" class="brand-wordmark">
        </a>

        <nav class="icones-header-" aria-label="Navegação">
            <a href="index.html">Voltar à loja</a>

            <a href="carrinho.html" aria-label="Carrinho">
                <img src="../imagens/carrinho branco.png" alt="Carrinho" class="carrinho">
            </a>
        </nav>
    </div>
</header>

<main class="pedidos-main">
    <section class="pedidos-card">

        <div class="pedidos-topo">
            <div>
                <h1>Meus Pedidos</h1>
                <p>Acompanhe suas compras realizadas na Eskillows.</p>
            </div>
        </div>

        <div id="pedidos-mensagem" class="pedidos-mensagem" role="status" aria-live="polite">
            Carregando seu histórico de compras...
        </div>

        <div id="lista-pedidos"></div>

        <div class="pedidos-acoes">
            <a href="minha-conta.html">
                <i class="fa-solid fa-user"></i>
                Minha Conta
            </a>

            <a href="index.html">
                <i class="fa-solid fa-store"></i>
                Voltar à loja
            </a>
        </div>

    </section>
</main>

<footer>
    <div class="footer-info">
        <img src="../imagens/LOGO%20ESQ.png" alt="Eskillows">
        <p>Direitos reservados: Equipe Eskillows.</p>
    </div>
</footer>

<script src="../meus-pedidos.js"></script>

</body>
</html>
